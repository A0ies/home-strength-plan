<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home Strength Plan</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECEEE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F110F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, a dark "session" card as the anchor, tab bar fixed at the bottom; the workout player takes over the whole screen. */
:root{
  --bg:#ECEEE8; --surface:#FFFFFF; --soft:#E3E6DE; --line:#D6DAD0;
  --ink:#15171A; --muted:#4E534B; --faint:#6A7065;
  --accent:#C6F432; --accent-ink:#15171A;
  --hero:#15171A; --hero-2:#2A2D29; --hero-line:#3A3E38; --on-hero:#FFFFFF; --on-hero-muted:#B9BDB4;
  --blue:#2B45D9; --blue-soft:#E3E8FF; --warn:#9A4A00; --warn-soft:#FFEBD6;
  --font-display:"Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", sans-serif;
  --font-body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F110F; --surface:#1A1D19; --soft:#242822; --line:#2F342D;
  --ink:#EEF0EA; --muted:#AEB3A8; --faint:#8E9489;
  --accent:#C6F432; --accent-ink:#15171A;
  --hero:#1F231D; --hero-2:#2C3029; --hero-line:#3D4239; --on-hero:#FFFFFF; --on-hero-muted:#B9BDB4;
  --blue:#9DAEFF; --blue-soft:#222A4D; --warn:#FFB874; --warn-soft:#3A2814;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F110F; --surface:#1A1D19; --soft:#242822; --line:#2F342D;
  --ink:#EEF0EA; --muted:#AEB3A8; --faint:#8E9489;
  --accent:#C6F432; --accent-ink:#15171A;
  --hero:#1F231D; --hero-2:#2C3029; --hero-line:#3D4239; --on-hero:#FFFFFF; --on-hero-muted:#B9BDB4;
  --blue:#9DAEFF; --blue-soft:#222A4D; --warn:#FFB874; --warn-soft:#3A2814;
  color-scheme:dark}
html,body{height:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:-0.02em;margin:0;text-wrap:balance;line-height:1.05}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 100px);display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top h1{font-size:36px}
.sub{font-size:14px;font-weight:600;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.card{background:var(--surface);border-radius:18px;padding:14px 16px}
.note{display:flex;gap:12px;align-items:flex-start}
.note .ic{width:36px;height:36px;border-radius:10px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--blue)}
.note.warn .ic{background:var(--warn-soft);color:var(--warn)}
.note b{display:block}
.note p{margin:2px 0 0;color:var(--muted);font-size:14px}
.hero{background:var(--hero);color:var(--on-hero);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero .tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero .big{font-family:var(--font-display);font-size:46px;font-weight:800;line-height:.95;letter-spacing:-.03em}
.hero .meta{font-size:13px;color:var(--on-hero-muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;border:1px solid var(--hero-line);border-radius:999px;padding:5px 10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:16px;border:0;font-weight:700;font-size:17px;padding:0 16px;text-decoration:none}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;border:1px solid var(--hero-line);color:var(--on-hero);min-height:48px;font-size:15px;font-weight:600}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-line{background:transparent;border:1px solid var(--line);color:var(--ink);min-height:48px;font-size:15px;font-weight:600}
.btn-small{min-height:44px;font-size:13px;border-radius:999px;padding:0 14px;background:var(--soft);color:var(--ink);border:0;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.list{background:var(--surface);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:10px 12px}
.li + .li{border-top:1px solid var(--soft)}
.li .grow{flex:1;min-width:0}
.li .t{font-size:15px;font-weight:700}
.li .s{font-size:12.5px;color:var(--muted);margin-top:1px}
.thumb{width:64px;height:48px;border-radius:10px;overflow:hidden;position:relative;flex-shrink:0;background:var(--soft)}
.slot{position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:6px;background:#15171A;color:#C6F432;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:2}
.flip{position:relative;overflow:hidden}
.flip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.flip .b{animation:flip 2.6s steps(1) infinite}
.flip.m-start .b{animation:none;opacity:0}
.flip.m-end .b{animation:none;opacity:1}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border-radius:18px;padding:14px 16px}
.stat .k{font-size:12px;font-weight:600;color:var(--muted)}
.stat .v{font-family:var(--font-display);font-size:26px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .s{font-size:13px;color:var(--muted);margin-top:4px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:-8px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{background:none;border:0;height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--faint)}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab svg{width:22px;height:22px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:4px;background:var(--line)}
.dot.on{background:var(--ink)}
.dot.now{background:var(--accent);outline:1.5px solid var(--ink);outline-offset:-1.5px}
.bar{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.bar span{height:8px;border-radius:4px;background:var(--line)}
.bar span.on{background:var(--ink)}
.bar span.now{background:var(--accent);outline:1px solid var(--ink);outline-offset:-1px}
.day{display:flex;align-items:center;gap:12px;padding:9px 14px}
.day + .day{border-top:1px solid var(--soft)}
.date{width:46px;height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;background:var(--soft);color:var(--ink)}
.date .w{font-size:11px;font-weight:700;text-transform:uppercase}
.date .n{font-family:var(--font-display);font-size:20px;font-weight:800;line-height:1}
.date.done{background:var(--ink);color:var(--bg)}
.date.missed{background:transparent;border:1.5px dashed var(--faint);color:var(--muted)}
.date.today{background:var(--accent);color:var(--accent-ink);border:1.5px solid var(--ink)}
.status{font-size:12px;font-weight:700;border-radius:999px;padding:5px 10px;background:var(--soft);white-space:nowrap}
.status.new{background:var(--ink);color:var(--accent)}
.status.plan{background:var(--blue-soft);color:var(--blue)}
.strike{text-decoration:line-through;color:var(--muted)}
.lvl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;margin:6px 0}
.lvl span{height:6px;border-radius:3px;background:var(--line)}
.lvl span.on{background:var(--ink)}
.muted{color:var(--muted)}
.small{font-size:13px}
details.ex{background:var(--surface);border-radius:18px;overflow:hidden}
details.ex + details.ex{margin-top:8px}
details.ex summary{list-style:none;display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer}
details.ex summary::-webkit-details-marker{display:none}
details.ex .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.photo{height:210px;border-radius:16px;background:var(--soft)}
ol.cues{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:14px}
ol.cues li{display:flex;gap:10px}
ol.cues .n{width:22px;height:22px;border-radius:6px;background:var(--soft);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.badge{font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;background:var(--ink);color:var(--accent);white-space:nowrap}
.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:22px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:88%;overflow:auto}
.sheet h2{font-size:24px}
.opt{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
/* Player */
.player{position:fixed;inset:0;background:var(--hero);color:var(--on-hero);z-index:40;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.player .in{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:16px 24px;min-height:100%;display:flex;flex-direction:column;gap:12px}
.segs{display:grid;gap:4px}
.seg{height:6px;border-radius:3px;background:var(--hero-line);overflow:hidden}
.seg i{display:block;height:100%;background:var(--accent)}
.pmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--on-hero-muted);font-variant-numeric:tabular-nums}
.pmeta b{color:var(--on-hero)}
.pphoto{height:clamp(190px,32vh,280px);border-radius:22px;background:var(--hero-2)}
.plabel{position:absolute;left:12px;top:12px;z-index:3;font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:4px 9px}
.pnote{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;font-size:12px;font-weight:600;color:#fff;background:rgba(15,17,15,.84);border-radius:10px;padding:6px 10px;line-height:1.3}
.seg-ctl{display:inline-flex;background:var(--hero-2);border-radius:12px;padding:3px;align-self:flex-start}
.seg-ctl button{height:38px;padding:0 14px;border:0;border-radius:9px;background:transparent;color:var(--on-hero-muted);font-size:13px;font-weight:700}
.seg-ctl button[aria-pressed="true"]{background:var(--on-hero);color:var(--hero)}
.pname{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.pname h2{font-size:28px}
.target{text-align:right;flex-shrink:0}
.target .v{font-family:var(--font-display);font-size:42px;font-weight:800;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.target .u{font-size:12px;color:var(--on-hero-muted)}
.player ol.cues .n{background:var(--hero-2)}
.player ol.cues span:last-child{color:#E2E4DE}
.wrow{display:flex;align-items:center;gap:8px;background:var(--hero-2);border-radius:16px;padding:6px 6px 6px 14px}
.wrow label{font-size:13px;font-weight:700;color:var(--on-hero-muted);margin-right:auto}
.wrow button{width:44px;height:44px;border-radius:12px;border:0;background:var(--hero);color:var(--on-hero);font-size:22px;font-weight:700;line-height:1}
.kgbox{display:flex;align-items:baseline;gap:4px}
.kgbox input{width:64px;height:44px;border:0;border-radius:10px;background:var(--hero);color:var(--on-hero);font:inherit;font-family:var(--font-display);font-size:22px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.kgbox input::placeholder{color:var(--on-hero-muted);font-size:14px;font-weight:600;font-family:var(--font-body)}
.kgbox span{font-size:13px;color:var(--on-hero-muted)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;font-size:13px;text-decoration:underline;min-height:44px;padding:0;align-self:flex-start}
.ctrl{display:flex;gap:10px;margin-top:auto}
.iconbtn{width:64px;min-height:60px;border-radius:18px;border:0;background:var(--hero-2);display:flex;align-items:center;justify-content:center;color:var(--on-hero)}
.rest{background:var(--blue);color:#fff;border-radius:20px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto}
:root[data-theme="dark"] .rest{background:#2B45D9}
.rest .v{font-family:var(--font-display);font-size:36px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.rest button{border:0;border-radius:14px;min-height:48px;padding:0 16px;font-weight:700;background:#fff;color:#2B45D9}
.rest .plus{background:rgba(255,255,255,.18);color:#fff}
.overlay{position:fixed;inset:0;background:rgba(15,17,15,.94);z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center;color:#fff}
.overlay .w{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.done-screen{background:var(--accent);color:var(--accent-ink)}
.done-screen .in{gap:16px}
.done-screen h1{font-size:54px;line-height:.92}
.done-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.done-tiles div{background:#15171A;color:#fff;border-radius:16px;padding:12px}
.done-tiles .v{font-family:var(--font-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.done-tiles .k{font-size:12px;color:#B9BDB4}
.done-panel{background:#FFFFFF;color:#15171A;border-radius:24px;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.feel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.feel button{min-height:52px;border-radius:14px;border:1px solid #B9BDB4;background:#fff;color:#15171A;font-weight:700;font-size:14px}
.feel button[aria-pressed="true"]{background:#15171A;color:#C6F432;border-color:#15171A}
.change{background:#ECEEE8;border-radius:16px;padding:12px 14px;font-size:14px;display:flex;gap:10px;color:#15171A}
.change .ic{width:28px;height:28px;border-radius:8px;background:#15171A;color:#C6F432;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60}
@media (prefers-reduced-motion: reduce){.flip .b{animation-duration:4s}}
</style>

</head>

var LAD = {reps:[8,10,12,15], side:[6,8,10,12], sec:[30,40,50,60]};

var TRAIN_DAYS = [2,5];

/* ---------- Dates ---------- */
function pad(n){return (n<10?"0":"")+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function add(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function today(){return iso(new Date())}
function dow(s){return parse(s).getDay()}
function isTrain(s){return TRAIN_DAYS.indexOf(dow(s))>=0}
function nextTrain(s){var d=add(s,1);while(!isTrain(d))d=add(d,1);return d}
function prevTrain(s){var d=add(s,-1);while(!isTrain(d))d=add(d,-1);return d}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/86400000)}
function nice(s){var d=parse(s);return DOWL[d.getDay()]+" "+d.getDate()+" "+MONL[d.getMonth()]}
function short(s){var d=parse(s);return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]}
function mmss(sec){sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+":"+pad(sec%60)}

  var slots={};SLOTS.forEach(function(s){slots[s.id]={step:0,load:0,streak:0,hard:0}});
  return {v:1,startedAt:today(),log:[],slots:slots,swaps:{},weights:{},prefs:{photo:"auto"}};
}

if(!S.weights)S.weights={};

function save(){

  if(dbRef){clearTimeout(saveTimer);saveTimer=setTimeout(function(){
    dbRef.set(JSON.parse(JSON.stringify(S))).catch(function(err){

    });

}

        if((remote.log||[]).length>=S.log.length){S=JSON.parse(JSON.stringify(remote));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
        else save();

}

/* ---------- Program logic ---------- */
function count(){return S.log.length}
function monthOf(n){return Math.floor(n/PER_MONTH)+1}
function curMonth(){return monthOf(count())}
function inMonth(){return count()%PER_MONTH+1}
function exFor(slot,month){
  var sw=S.swaps[month]&&S.swaps[month][slot];
  if(sw&&EX[sw])return sw;
  var r=ROT[slot];return r[(month-1)%r.length];
}
function pool(slot){return ROT[slot].concat(EXTRA[slot])}
function lastDate(){return S.log.length?S.log[S.log.length-1].date:null}
function away(){var l=lastDate();return l?daysBetween(l,today())>10:false}
function dose(slot,exId,reentry){
  var e=EX[exId],st=S.slots[slot],lad=LAD[e.unit];
  var step=Math.max(0,Math.min(3,st.step-(reentry?1:0)));
  return {target:lad[step],step:step,load:st.load,unit:e.unit,label:unitLabel(e)};
}
function unitLabel(e){return e.unit==="sec"?"seconds":e.unit==="side"?e.side:"reps"}
function doseText(d,sets){
  var s=(sets||SETS)+" × "+d.target+(d.unit==="sec"?" s":d.unit==="side"?" "+d.label:"");
  return s;
}
function fmtKg(k){return (Math.round(k*10)/10).toString().replace(".",",")+" kg"}
function kgOf(exId){return S.weights&&S.weights[exId]>0?S.weights[exId]:0}
function kgStep(slot){return (slot==="A"||slot==="C")?2:1}
function kgHistory(exId){var out=[];S.log.forEach(function(s){(s.items||[]).forEach(function(it){if(it.ex===exId&&it.kg&&it.kg.length){var m=Math.max.apply(null,it.kg);if(m>0)out.push({date:s.date,kg:m})}})});return out}
function loadText(slot,exId){
  if(kgOf(exId))return " · "+fmtKg(kgOf(exId));
  var l=S.slots[slot].load,g=EX[exId].gear.toLowerCase();if(!l)return "";
  if(g.indexOf("dumbbell")>=0)return " · heavier dumbbells";
  if(g.indexOf("backpack")>=0)return " · +"+(l*2)+" books";
  if(g.indexOf("bag")>=0)return " · fuller bags";
  if(g.indexOf("book")>=0)return " · heavier book";
  return " · slower tempo";
}
function lineup(reentry){
  var m=curMonth();
  return SLOTS.map(function(s){var id=exFor(s.id,m);return {slot:s.id,cat:s.name,ex:id,dose:dose(s.id,id,reentry)}});
}
function estMinutes(list,sets){
  var t=120;list.forEach(function(it){var per=it.dose.unit==="sec"?it.dose.target:it.dose.unit==="side"?it.dose.target*2*3.2:it.dose.target*3.2;t+=sets*(per+15)+(sets)*REST});
  return Math.round(t/60);
}

/* What should happen today */
function todayStatus(){
  var t=today();
  if(S.log.some(function(s){return s.date===t}))return {kind:"doneToday"};
  if(!S.log.length)return {kind:"first"};
  if(isTrain(t))return {kind:"due"};
  var p=prevTrain(t);
  if(p>=S.startedAt&&!S.log.some(function(s){return s.date>=p}))return {kind:"catchup",from:p};
  return {kind:"rest",next:nextTrain(t)};
}

/* Train-day timeline for Plan & Progress */
function timeline(from,to){
  var out=[],d=isTrain(from)?from:nextTrain(from),t=today();
  while(d<=to){
    var nx=nextTrain(d);
    var ss=S.log.filter(function(s){return s.date>=d&&s.date<nx});
    var st;
    if(ss.length)st="done";
    else if(d>t)st="planned";
    else if(t<nx)st=(d===t?"today":"open");
    else st="missed";
    out.push({date:d,state:st,sessions:ss,next:nx});
    d=nx;
  }
  return out;
}

/* Progression after a session */
function applyProgression(sess,feel){
  var changes=[],before={slots:JSON.parse(JSON.stringify(S.slots)),weights:JSON.parse(JSON.stringify(S.weights||{}))};
  if(sess.reentry){SLOTS.forEach(function(s){var st=S.slots[s.id];if(st.step>0)st.step--;st.streak=0});changes.push({t:"Welcome back",d:"Everything was one step easier today. You build back up from here."})}
  if(sess.short||sess.partial){
    changes.push({t:sess.short?"Short version counted":"Partial session counted",d:"It counts as a session. Reps only go up after full sessions."});
  }else{
    sess.items.forEach(function(it){
      var st=S.slots[it.slot],e=EX[it.ex],lad=LAD[e.unit];
      if(feel==="hard"||it.easier){
        st.streak=0;st.hard++;
        if(st.hard>=2){st.hard=0;if(st.step>0){st.step--;changes.push({t:e.name+" eases off",d:"Two tough sessions in a row: next time "+lad[st.step]+" "+unitLabel(e)+"."})}}
      }else{
        st.hard=0;st.streak+=(feel==="easy"?2:1);
        if(st.streak>=2){
          st.streak=0;
          if(st.step<3){st.step++;changes.push({t:e.name+" gets harder",d:"Next time "+SETS+" × "+lad[st.step]+" "+unitLabel(e)+"."})}
          else{st.load++;st.step=1;var w=kgOf(it.ex);if(w){S.weights[it.ex]=w+kgStep(it.slot);changes.push({t:e.name+": more weight",d:"Go to "+fmtKg(S.weights[it.ex])+" next time. Reps go back to "+lad[1]+"."})}else changes.push({t:e.name+": add weight",d:loadAdvice(e)+" Reps go back to "+lad[1]+"."})}
        }
      }
    });
  }
  var n=S.log.length;
  if(n%PER_MONTH===0){
    var m=monthOf(n);
    SLOTS.forEach(function(s){if(exFor(s.id,m)!==exFor(s.id,m-1)){var st=S.slots[s.id];if(st.step>0)st.step--;st.streak=0;st.hard=0}});
    changes.push({t:"Month "+(m-1)+" done",d:"Next session brings new exercises for month "+m+"."});
  }
  if(!changes.length)changes.push({t:"Same plan next time",d:"Do it once more like this and things start to go up."});
  sess.feel=feel;sess.before=before;sess.changes=changes;
}
function loadAdvice(e){var g=e.gear.toLowerCase();if(g.indexOf("dumbbell")>=0)return "Use heavier dumbbells, and log the new weight.";if(g.indexOf("backpack")>=0)return "Put 2 more books in the backpack.";if(g.indexOf("bag")>=0)return "Fill the bags a bit more.";if(g.indexOf("book")>=0)return "Use a heavier book.";return "Go slower: 3 seconds down on every rep."}
function refeel(feel){
  var sess=S.log[S.log.length-1];if(!sess||!sess.before)return;
  if(sess.before.slots){S.slots=JSON.parse(JSON.stringify(sess.before.slots));S.weights=JSON.parse(JSON.stringify(sess.before.weights||{}))}else S.slots=JSON.parse(JSON.stringify(sess.before));
  applyProgression(sess,feel);save();
}

  var el=document.getElementById("p-el");if(el)el.textContent=mmss(P.elapsed);

    '<div class="small" style="font-weight:700">'+nice(s.date)+' · '+(s.short?"Short version":"Month "+s.month+", session "+((s.n-1)%PER_MONTH+1))+'</div>'+
    '<h1>'+(full?"Done.<br>You can sit now.":"Saved.<br>That counts.")+'</h1>'+
    '<div class="done-tiles"><div><div class="v">'+mmss(s.secs)+'</div><div class="k">time</div></div><div><div class="v">'+s.setsDone+'/'+s.setsTotal+'</div><div class="k">sets</div></div><div><div class="v">'+s.n+'</div><div class="k">sessions total</div></div></div>'+
    '<div class="done-panel"><div><h2 style="font-size:22px">How did that feel?</h2><div class="small" style="color:#4E534B;margin-top:2px">One tap. This decides how fast things get harder.</div></div>'+
    '<div class="feel">'+[["easy","Too easy"],["right","About right"],["hard","Too hard"]].map(function(x){return '<button data-act="feel" data-v="'+x[0]+'" aria-pressed="'+(feel===x[0])+'">'+x[1]+'</button>'}).join("")+'</div>'+
    (s.changes||[]).map(function(c){return '<div class="change"><span class="ic">'+I.up+'</span><div><b>'+esc(c.t)+'</b><div style="color:#4E534B">'+esc(c.d)+'</div></div></div>'}).join("")+
    '<div class="small" style="color:#4E534B">Next: <b style="color:#15171A">'+nice(nextTrain(s.date))+'</b>.</div>'+
    '<button class="btn" style="background:#15171A;color:#fff" data-act="closedone">Close</button></div></div></div>';
}

/* ---------- Backup ---------- */
function exportBackup(){
  var name="training-backup-"+today()+".json",json=JSON.stringify(S,null,1);
  var file;try{file=new File([json],name,{type:"application/json"})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Training backup"}).catch(function(){});return}
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
}
document.addEventListener("input",function(ev){
  if(ev.target.id!=="kg-input"||!P||!P.items)return;
  var raw=ev.target.value.replace(",",".").replace(/[^0-9.]/g,""),n=parseFloat(raw);
  P.items[P.i].curKg=isNaN(n)?0:Math.max(0,Math.min(300,n));
});
document.addEventListener("change",function(ev){
  if(ev.target.id!=="import-file"||!ev.target.files[0])return;
  var r=new FileReader();r.onload=function(){
    try{var d=JSON.parse(r.result);if(!d||d.v!==1||!Array.isArray(d.log)||!d.slots)throw 0;S=d;if(!S.weights)S.weights={};save();render();toast("Backup restored: "+S.log.length+" sessions")}
    catch(e){toast("That file isn't a training backup")}
  };r.readAsText(ev.target.files[0]);ev.target.value="";
});

/* ---------- Events ---------- */
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");if(!b)return;
  var a=b.getAttribute("data-act"),v=b.getAttribute("data-v"),x=b.getAttribute("data-x");
  if(a==="closesheet"&&b.classList.contains("sheet-wrap")&&ev.target!==b)return;
  switch(a){
    case "tab":TAB=v;try{localStorage.setItem(KEY+"-tab",v)}catch(e){};render();window.scrollTo(0,0);break;
    case "start":startSession(v);break;
    case "swap":openSwap(v);break;
    case "pickswap":setSwap(v,x);break;
    case "useex":setSwap(v,x);break;
    case "closesheet":layer.innerHTML="";break;
    case "reset":openReset();break;
    case "export":exportBackup();break;
    case "doreset":S=fresh();save();layer.innerHTML="";render();toast("Fresh start");break;
    case "pause":pause(true);break;
    case "resume":pause(false);break;
    case "askend":if(!P.paused)pause(true);P.confirm=true;renderPlayer();break;
    case "cancelend":P.confirm=false;pause(false);break;
    case "endnow":P.confirm=false;finish(true);break;
    case "skipwarm":toWork();break;
    case "setdone":setDone();break;
    case "starttimer":P.timer=true;P.phaseStart=Date.now();P.phaseLen=P.items[P.i].target;renderPlayer();break;
    case "skiprest":toWork();break;
    case "plus":P.phaseLen+=15;break;
    case "easier":var it=P.items[P.i];it.easier=true;it.target=Math.max(it.unit==="sec"?15:3,it.target-(it.unit==="sec"?10:2));renderPlayer();break;
    case "photo":S.prefs.photo=v;save();renderPlayer();break;
    case "kg":var ik=P.items[P.i];setKg(ik,(ik.curKg||0)+parseFloat(v));break;
    case "feel":refeel(v);P.sess=S.log[S.log.length-1];renderDone();break;
    case "closedone":P=null;layer.innerHTML="";TAB="today";render();break;
  }
});
document.addEventListener("toggle",function(ev){var d=ev.target;if(d.matches&&d.matches("details.ex")&&d.open)openEx=d.getAttribute("data-key")},true);
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&layer.querySelector(".sheet")&&!(P&&P.confirm)){layer.innerHTML=""}});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&P&&P.phase!=="done"&&navigator.wakeLock){navigator.wakeLock.request("screen").then(function(w){wake=w}).catch(function(){})}});

render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
</script>
</body>
</html>
