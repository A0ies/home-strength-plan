<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Home Strength Plan</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECEEE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F110F" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: every screen is one fixed frame (no page scroll, no zoom). Flexible regions (photos, tile grids) absorb the height difference between phones. */
:root{
  --bg:#ECEEE8; --surface:#FFFFFF; --soft:#E3E6DE; --line:#D6DAD0;
  --ink:#15171A; --muted:#4E534B; --faint:#6A7065;
  --accent:#C6F432; --accent-ink:#15171A;
  --hero:#15171A; --hero-2:#2A2D29; --hero-line:#3A3E38; --on-hero:#FFFFFF; --on-hero-muted:#B9BDB4;
  --blue:#2B45D9; --blue-soft:#E3E8FF; --warn:#9A4A00; --warn-soft:#FFEBD6;
  --font-display:"Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", sans-serif;
  --font-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --gap:12px; --pad:16px; --tabh:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F110F; --surface:#1A1D19; --soft:#242822; --line:#2F342D;
  --ink:#EEF0EA; --muted:#AEB3A8; --faint:#8E9489;
  --hero:#1F231D; --hero-2:#2C3029; --hero-line:#3D4239;
  --blue:#9DAEFF; --blue-soft:#222A4D; --warn:#FFB874; --warn-soft:#3A2814;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F110F; --surface:#1A1D19; --soft:#242822; --line:#2F342D;
  --ink:#EEF0EA; --muted:#AEB3A8; --faint:#8E9489;
  --hero:#1F231D; --hero-2:#2C3029; --hero-line:#3D4239;
  --blue:#9DAEFF; --blue-soft:#222A4D; --warn:#FFB874; --warn-soft:#3A2814;
  color-scheme:dark}
@media (max-height:720px){:root{--gap:9px;--pad:14px;--tabh:56px}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{position:fixed;inset:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
img{max-width:100%;-webkit-user-drag:none}
[hidden]{display:none!important}
button,input,label{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input{font-size:16px;user-select:text;-webkit-user-select:text}
button:focus-visible,label:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:-0.02em;margin:0;line-height:1.02}

/* ---------- App frame ---------- */
.app{position:fixed;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto}
.view{min-height:0;width:100%;max-width:520px;margin:0 auto;overflow:hidden;display:flex;flex-direction:column;gap:var(--gap);padding:calc(env(safe-area-inset-top,0px) + 14px) var(--pad) var(--gap)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex:none}
.top h1{font-size:clamp(26px,4.4vh,36px)}
.sub{font-size:13px;font-weight:600;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--muted)} .small{font-size:13px}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.two{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Tab bar */
.tabs{background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--faint)}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab svg{width:22px;height:22px}

/* Status strip */
.strip{flex:none;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:9px 12px;font-size:13px}
.strip .ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--blue-soft);color:var(--blue);flex:none}
.strip.warn .ic{background:var(--warn-soft);color:var(--warn)}
.strip b{font-weight:700}

/* Hero (today's session) */
.hero{flex:none;background:var(--hero);color:var(--on-hero);border-radius:22px;padding:clamp(14px,2.2vh,20px);display:flex;flex-direction:column;gap:clamp(8px,1.4vh,12px)}
.hero .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hero .tag{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero .meta{font-size:13px;color:var(--on-hero-muted)}
.hero .big{font-family:var(--font-display);font-size:clamp(30px,5.4vh,46px);font-weight:800;line-height:.95;letter-spacing:-.03em}
.hero .btns{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;font-weight:700;font-size:16.5px;padding:0 16px;text-align:center}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{border:1px solid var(--hero-line);color:var(--on-hero);font-size:14px;font-weight:600}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-line{border:1px solid var(--line);color:var(--ink);font-size:15px;font-weight:600;min-height:48px}
.btn-soft{background:var(--soft);color:var(--ink);font-size:15px;font-weight:600;min-height:48px}
.chip{font-size:12px;font-weight:600;border:1px solid var(--hero-line);border-radius:999px;padding:4px 9px;white-space:nowrap}
.chips{display:flex;gap:6px;overflow:hidden;flex-wrap:nowrap}

/* Exercise tiles */
.tiles{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:8px}
.tiles.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{position:relative;display:flex;flex-direction:column;min-height:0;background:var(--surface);border-radius:16px;overflow:hidden;text-align:left}
.tile .ph{position:relative;flex:1;min-height:0;background:var(--soft)}
.tile .tx{padding:6px 8px 8px;flex:none}
.tile .nm{font-size:13px;font-weight:700;line-height:1.2}
.tile .ds{font-size:11.5px;color:var(--muted);margin-top:2px}
.tile[aria-pressed="true"]{outline:2.5px solid var(--ink);outline-offset:-2.5px}
.badge{position:absolute;left:6px;top:6px;z-index:3;min-width:20px;height:20px;padding:0 5px;border-radius:7px;background:#15171A;color:#C6F432;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.badge.r{left:auto;right:6px;background:#C6F432;color:#15171A}
.flip{position:absolute;inset:0;overflow:hidden}
.flip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.flip .b{animation:flip 2.6s steps(1) infinite}
.flip.m-start .b{animation:none;opacity:0}
.flip.m-end .b{animation:none;opacity:1}
@keyframes flip{0%{opacity:0}50%{opacity:1}}

/* Cards, stats, lists */
.card{background:var(--surface);border-radius:18px;padding:12px 14px}
.stats{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border-radius:16px;padding:10px 12px}
.stat .k{font-size:11.5px;font-weight:600;color:var(--muted)}
.stat .v{font-family:var(--font-display);font-size:clamp(20px,3.2vh,26px);font-weight:800;font-variant-numeric:tabular-nums}
.dots{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;margin-top:8px}
.dot{height:clamp(12px,2vh,18px);border-radius:5px;background:var(--line)}
.dot.on{background:var(--ink)}
.dot.now{background:var(--accent);outline:1.5px solid var(--ink);outline-offset:-1.5px}
.dot.miss{background:transparent;outline:1.5px dashed var(--faint);outline-offset:-1.5px}
.dot.later{opacity:.4}
.list{background:var(--surface);border-radius:18px;overflow:hidden;flex:none}
.day{display:flex;align-items:center;gap:12px;padding:0 12px;height:clamp(50px,7.2vh,60px)}
.day + .day{border-top:1px solid var(--soft)}
.date{width:42px;height:42px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;background:var(--soft);color:var(--ink)}
.date .w{font-size:10px;font-weight:700;text-transform:uppercase}
.date .n{font-family:var(--font-display);font-size:18px;font-weight:800;line-height:1}
.date.done{background:var(--ink);color:var(--bg)}
.date.missed{background:transparent;border:1.5px dashed var(--faint);color:var(--muted)}
.date.today{background:var(--accent);color:var(--accent-ink);border:1.5px solid var(--ink)}
.status{font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 9px;background:var(--soft);white-space:nowrap;flex:none}
.status.new{background:var(--ink);color:var(--accent)}
.status.plan{background:var(--blue-soft);color:var(--blue)}
.strike{text-decoration:line-through;color:var(--muted)}
.grow{flex:1;min-width:0}
.slots{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:8px}
.slotc{background:var(--surface);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;min-height:0;overflow:hidden}
.slotc .h{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12px;font-weight:700;color:var(--faint)}
.slotc .nm{font-size:14px;font-weight:700;line-height:1.2}
.slotc .v{font-family:var(--font-display);font-size:clamp(17px,2.6vh,21px);font-weight:800;font-variant-numeric:tabular-nums}
.slotc .nx{font-size:11.5px;color:var(--muted)}
.lvl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}
.lvl span{height:5px;border-radius:3px;background:var(--line)}
.lvl span.on{background:var(--ink)}
.row2{flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg-sel{flex:none;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;background:var(--surface);border-radius:14px;padding:4px}
.seg-sel button{height:44px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.seg-sel b{font-family:var(--font-display);font-size:17px}
.seg-sel span{font-size:9.5px;font-weight:600;color:var(--faint)}
.seg-sel button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg-sel button[aria-pressed="true"] span{color:var(--bg);opacity:.75}

/* Sheets */
.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:520px;max-height:calc(100% - env(safe-area-inset-top,0px) - 16px);border-radius:24px 24px 0 0;padding:18px var(--pad) calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;overflow:hidden}
.sheet .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex:none}
.sheet h2{font-size:24px}
.x{width:44px;height:44px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;margin:-6px -4px 0 0}
.sphoto{position:relative;height:clamp(150px,28vh,260px);border-radius:16px;background:var(--soft);flex:none;overflow:hidden}
.pnote{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;font-size:12px;font-weight:600;color:#fff;background:rgba(15,17,15,.84);border-radius:10px;padding:6px 10px;line-height:1.3}
ol.cues{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:14px;flex:none}
ol.cues li{display:flex;gap:9px;align-items:flex-start}
ol.cues .n{width:20px;height:20px;border-radius:6px;background:var(--soft);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.facts{display:flex;gap:6px;flex-wrap:wrap;flex:none}
.fact{background:var(--soft);border-radius:10px;padding:6px 9px;font-size:12.5px}
.fact b{font-weight:700}
.sbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;flex:none}
.sbtns.one1{grid-template-columns:1fr}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;flex:none}
.opt{display:flex;align-items:center;gap:10px;padding:6px;border-radius:14px;border:1.5px solid var(--line);text-align:left;min-height:58px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
.opt .th{position:relative;width:52px;height:44px;border-radius:9px;overflow:hidden;flex:none;background:var(--soft)}
.opt .nm{font-size:13px;font-weight:700;line-height:1.2}
.opt .ds{font-size:11.5px;color:var(--muted)}
.rules{display:flex;flex-direction:column;gap:10px;font-size:14px}
.rules b{display:block;font-size:14px}

/* ---------- Player ---------- */
.player{position:fixed;inset:0;background:var(--hero);color:var(--on-hero);z-index:40;overflow:hidden}
.player .in{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(7px,1.2vh,11px);padding:calc(env(safe-area-inset-top,0px) + 10px) var(--pad) calc(env(safe-area-inset-bottom,0px) + 12px)}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex:none}
.ptop .t{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ptop .m{font-size:13px;color:var(--on-hero-muted);font-variant-numeric:tabular-nums}
.ibtn{height:44px;min-width:44px;padding:0 14px;border-radius:12px;background:var(--hero-2);color:var(--on-hero);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.segs{display:grid;gap:4px;flex:none}
.seg{height:6px;border-radius:3px;background:var(--hero-line);overflow:hidden}
.seg i{display:block;height:100%;background:var(--accent)}
.pphoto{position:relative;flex:1;min-height:96px;border-radius:20px;background:var(--hero-2);overflow:hidden}
.pmode{position:absolute;right:8px;top:8px;z-index:3;display:flex;background:rgba(15,17,15,.78);border-radius:11px;padding:3px}
.pmode button{height:32px;padding:0 10px;border-radius:8px;color:#B9BDB4;font-size:12px;font-weight:700}
.pmode button[aria-pressed="true"]{background:#fff;color:#15171A}
.pname{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex:none}
.pname h2{font-size:clamp(22px,3.4vh,28px)}
.pname .g{font-size:13px;color:var(--on-hero-muted);margin-top:2px}
.target{text-align:right;flex:none}
.target .v{font-family:var(--font-display);font-size:clamp(34px,5.4vh,44px);font-weight:800;line-height:.95;color:var(--accent);font-variant-numeric:tabular-nums}
.target .u{font-size:12px;color:var(--on-hero-muted)}
.player ol.cues{font-size:clamp(12.5px,1.75vh,14px);gap:4px;color:#E2E4DE}
.player ol.cues .n{background:var(--hero-2);color:var(--on-hero)}
.wrow{flex:none;display:flex;align-items:center;gap:8px;background:var(--hero-2);border-radius:16px;padding:5px 5px 5px 12px;min-height:54px}
.wrow .lab{flex:1;min-width:0;font-size:12.5px;line-height:1.25;color:var(--on-hero-muted)}
.wrow .lab b{display:block;color:var(--on-hero);font-size:13px}
.wrow .st{width:44px;height:44px;border-radius:12px;background:var(--hero);color:var(--on-hero);font-size:22px;font-weight:700;line-height:1;flex:none}
.wrow .use{height:44px;padding:0 10px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:12.5px;font-weight:700;flex:none}
.kgbox{display:flex;align-items:baseline;gap:4px;flex:none}
.kgbox input{width:62px;height:44px;border:0;border-radius:10px;background:var(--hero);color:var(--on-hero);font-family:var(--font-display);font-size:22px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;padding:0}
.kgbox input::placeholder{color:var(--on-hero-muted);font-size:16px;font-weight:600;font-family:var(--font-body)}
.kgbox span{font-size:12.5px;color:var(--on-hero-muted)}
.pnext{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--on-hero-muted);min-height:28px}
.linkbtn{color:var(--accent);font-weight:700;font-size:13px;text-decoration:underline;min-height:36px;flex:none}
.ctrl{flex:none;display:flex;gap:10px}
.ctrl .ibtn{width:62px;height:58px;border-radius:18px}
.ctrl .btn{flex:1;min-height:58px;border-radius:18px;font-size:17px}
.rest{flex:none;background:#2B45D9;color:#fff;border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px}
.rest .v{font-family:var(--font-display);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.rest .l{font-size:13px;opacity:.92}
.rest .l b{font-size:15px;font-weight:800;opacity:1}
.rest button{border-radius:12px;height:44px;padding:0 14px;font-weight:700;background:#fff;color:#2B45D9}
.rest .plus{background:rgba(255,255,255,.18);color:#fff}
.nophoto2{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--faint)}
.player .nophoto2{color:var(--on-hero-muted)}
.nophoto{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--on-hero-muted);font-size:14px}
.wtag{position:absolute;left:8px;top:8px;z-index:3;font-size:11px;font-weight:700;color:#15171A;background:#C6F432;border-radius:999px;padding:4px 9px}
.warm{flex:1;min-height:0;border-radius:20px;background:var(--hero-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px}
.warm h2{font-size:clamp(26px,4vh,34px)}
.warm .c{font-family:var(--font-display);font-size:clamp(48px,9vh,72px);font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.overlay{position:fixed;inset:0;background:rgba(15,17,15,.95);z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center;color:#fff}
.overlay .w{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}

/* Done screen */
.done-screen{background:#C6F432;color:#15171A}
.done-screen h1{font-size:clamp(34px,6vh,52px);line-height:.92}
.done-tiles{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.done-tiles div{background:#15171A;color:#fff;border-radius:14px;padding:9px 11px}
.done-tiles .v{font-family:var(--font-display);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.done-tiles .k{font-size:11.5px;color:#B9BDB4}
.done-panel{flex:1;min-height:0;background:#FFFFFF;color:#15171A;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.feel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:none}
.feel button{min-height:48px;border-radius:14px;border:1px solid #B9BDB4;background:#fff;color:#15171A;font-weight:700;font-size:14px}
.feel button[aria-pressed="true"]{background:#15171A;color:#C6F432;border-color:#15171A}
.changes{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.change{background:#ECEEE8;border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.3;color:#15171A}
.change b{font-weight:700}
.change .d{color:#4E534B}
.more{font-size:13px;font-weight:700;color:#15171A;text-decoration:underline;min-height:32px;text-align:left}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;white-space:nowrap}
@media (prefers-reduced-motion: reduce){.flip .b{animation-duration:4s}}
/* shared */
.pill.soft{background:var(--soft)}
.row1{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex:none}
.nt{font-family:var(--font-display);font-weight:800;font-size:clamp(18px,2.6vh,22px);letter-spacing:-.01em;line-height:1.1}
.th{position:relative;border-radius:12px;overflow:hidden;background:var(--soft);aspect-ratio:1}
.th .badge{left:4px;top:4px;min-width:18px;height:18px;font-size:10px;border-radius:6px}
.th .nophoto2 span{display:none}

/* A: calendar */
.cal{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:10px 6px}
.cal-h{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:11px;font-weight:700;color:var(--faint);flex:none}
.cal-h .tr{color:var(--ink)}
.cal-g{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:4px 0}
.c{position:relative;display:flex;align-items:center;justify-content:center;border-radius:12px;font-weight:700;font-size:14px}
.c span{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;width:min(46px,94%);aspect-ratio:1;border-radius:50%}
.c.off,.c.pre{color:var(--faint);font-weight:500}
.c.off span,.c.pre span{width:auto}
.c.done span{background:var(--ink);color:var(--accent)}
.c.missed span,.c.moved span{border:1.5px dashed var(--faint);color:var(--muted)}
.c.today span{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 2px var(--ink)}
.c.planned span{background:var(--blue-soft);color:var(--blue)}
.c.new span{background:var(--ink);color:var(--accent)}
.c.is-today:not(.today) span{box-shadow:0 0 0 2px var(--ink)}
.c .mo{font-style:normal;font-size:9px;font-weight:800;color:var(--blue);text-transform:uppercase;line-height:1;margin-bottom:2px}
.c .nw{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:var(--accent)}
.cal-l{display:flex;justify-content:center;gap:12px;font-size:11.5px;font-weight:600;color:var(--muted);flex:none}
.cal-l span{display:flex;align-items:center;gap:5px}
.lg{width:11px;height:11px;border-radius:50%;display:inline-block}
.lg.done{background:var(--ink)} .lg.missed{border:1.5px dashed var(--faint)} .lg.today{background:var(--accent);box-shadow:0 0 0 1.5px var(--ink)} .lg.planned{background:var(--blue-soft);box-shadow:inset 0 0 0 1.5px var(--blue)}
.nextc{flex:none;background:var(--surface);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.nextc .thumbs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}

var TRAIN_DAYS = [2,5];
var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var DOWL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

/* ---------- Dates ---------- */
function pad(n){return (n<10?"0":"")+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function add(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function today(){return iso(new Date())}
function dow(s){return parse(s).getDay()}
function isTrain(s){return TRAIN_DAYS.indexOf(dow(s))>=0}
function nextTrain(s){var d=add(s,1);while(!isTrain(d))d=add(d,1);return d}
function prevTrain(s){var d=add(s,-1);while(!isTrain(d))d=add(d,-1);return d}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/86400000)}
function nice(s){var d=parse(s);return DOWL[d.getDay()]+" "+d.getDate()+" "+MONL[d.getMonth()]}
function short(s){var d=parse(s);return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]}
function mmss(sec){sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+":"+pad(sec%60)}

/* ---------- Program logic ---------- */
function count(){return S.log.length}
function monthOf(n){return Math.floor(n/PER_MONTH)+1}
function curMonth(){return monthOf(count())}
function inMonth(){return count()%PER_MONTH+1}
function exFor(slot,month){
  var sw=S.swaps[month]&&S.swaps[month][slot];
  if(sw&&EX[sw])return sw;
  var r=ROT[slot];return r[(month-1)%r.length];
}
function pool(slot){return ROT[slot].concat(EXTRA[slot])}
function lastDate(){return S.log.length?S.log[S.log.length-1].date:null}
function away(){var l=lastDate();return l?daysBetween(l,today())>10:false}
var FIXED = {reps:8, side:8, sec:40};
function weighted(exId){return !!(EX[exId]&&EX[exId].start)}
function dose(slot,exId,reentry){
  var e=EX[exId],st=S.slots[slot],lad=ladOf(e);
  var step=Math.max(0,Math.min(3,st.step-(reentry?1:0)));
  if(weighted(exId))return {target:FIXED[e.unit],step:step,load:st.load,unit:e.unit,label:unitLabel(e),fixed:true};
  return {target:lad[step],step:step,load:st.load,unit:e.unit,label:unitLabel(e)};
}
function unitLabel(e){return e.unit==="sec"?"seconds":e.unit==="side"?e.side:"reps"}
function doseText(d,sets){
  var s=(sets||SETS)+" × "+d.target+(d.unit==="sec"?" s":d.unit==="side"?" "+d.label:"");
  return s;
}
function fmtKg(k){return (Math.round(k*10)/10).toString().replace(".",",")+" kg"}
function kgOf(exId){return S.weights&&S.weights[exId]>0?S.weights[exId]:0}
function kgStep(slot){return (slot==="A"||slot==="C")?2:1}
function kgHistory(exId){var out=[];S.log.forEach(function(s){(s.items||[]).forEach(function(it){if(it.ex===exId&&it.kg&&it.kg.length){var m=Math.max.apply(null,it.kg);if(m>0)out.push({date:s.date,kg:m})}})});return out}
function loadText(slot,exId){
  if(kgOf(exId))return " · "+fmtKg(kgOf(exId));
  var l=S.slots[slot].load,g=EX[exId].gear.toLowerCase();if(!l)return "";
  if(g.indexOf("dumbbell")>=0)return " · heavier dumbbells";
  if(g.indexOf("backpack")>=0)return " · +"+(l*2)+" books";
  if(g.indexOf("bag")>=0)return " · fuller bags";
  if(g.indexOf("book")>=0)return " · heavier book";
  return " · slower tempo";
}
function lineup(reentry){
  var m=curMonth();
  return SLOTS.map(function(s){var id=exFor(s.id,m);return {slot:s.id,cat:s.name,ex:id,dose:dose(s.id,id,reentry)}});
}
function estMinutes(list,sets){
  var t=WARM_SECS;list.forEach(function(it){var per=it.dose.unit==="sec"?it.dose.target:it.dose.unit==="side"?it.dose.target*2*3.2:it.dose.target*3.2;t+=sets*(per+15)+(sets)*REST});
  return Math.round(t/60);
}

/* What should happen today */
function todayStatus(){
  var t=today();
  if(S.log.some(function(s){return s.date===t}))return {kind:"doneToday"};
  if(!S.log.length)return {kind:"first"};
  if(isTrain(t))return {kind:"due"};
  var p=prevTrain(t);
  if(p>=S.startedAt&&!S.log.some(function(s){return s.date>=p}))return {kind:"catchup",from:p};
  return {kind:"rest",next:nextTrain(t)};
}

/* Train-day timeline for Plan & Progress */
function timeline(from,to){
  var out=[],d=isTrain(from)?from:nextTrain(from),t=today();
  while(d<=to){
    var nx=nextTrain(d);
    var ss=S.log.filter(function(s){return s.date>=d&&s.date<nx});
    var st;
    if(ss.length)st="done";
    else if(d>t)st="planned";
    else if(t<nx)st=(d===t?"today":"open");
    else st="missed";
    out.push({date:d,state:st,sessions:ss,next:nx});
    d=nx;
  }
  return out;
}

/* Progression after a session */
function applyProgression(sess,feel){
  var changes=[],before={slots:JSON.parse(JSON.stringify(S.slots)),weights:JSON.parse(JSON.stringify(S.weights||{})),var:JSON.parse(JSON.stringify(S.var||{}))};
  if(sess.reentry){SLOTS.forEach(function(s){var st=S.slots[s.id];if(st.step>0)st.step--;st.streak=0});changes.push({t:"Welcome back",d:"Everything was one step easier today. You build back up from here."})}
  if(sess.short||sess.partial){
    changes.push({t:sess.short?"Short version counted":"Partial session counted",d:"It counts as a session. Weights and reps only go up after full sessions."});
  }else{
    sess.items.forEach(function(it){
      var st=S.slots[it.slot],e=EX[it.ex],lad=ladOf(e),w=kgOf(it.ex),usedKg=!!e.start;
      if(usedKg){
        var fx=FIXED[e.unit]+" "+unitLabel(e);
        if(feel==="hard"||it.easier){
          st.streak=0;st.hard++;
          if(st.hard>=2){st.hard=0;var down=Math.max(0.5,w-kgStep(it.slot));if(w&&down<w){S.weights[it.ex]=down;changes.push({t:e.name+" eases off",d:"Two tough sessions in a row: go back to "+fmtKg(down)+". Reps stay at "+fx+"."})}}
        }else{
          st.hard=0;st.streak+=(feel==="easy"?2:1);
          if(st.streak>=2){st.streak=0;if(w){S.weights[it.ex]=w+kgStep(it.slot);changes.push({t:e.name+": more weight",d:"Go to "+fmtKg(S.weights[it.ex])+" next time. Reps stay at "+fx+"."})}else changes.push({t:e.name+": time for weight",d:"Start with "+e.start[0]+" kg, "+e.start[2]+", and log it. Reps stay at "+fx+"."})}
        }
        return;
      }
      if(feel==="hard"||it.easier){
        st.streak=0;st.hard++;
        if(st.hard>=2){st.hard=0;if(st.step>0){st.step--;changes.push({t:e.name+" eases off",d:"Two tough sessions in a row: next time "+lad[st.step]+" "+unitLabel(e)+"."})}else if(isFam(it.ex)&&famLevel(it.ex)>0){S.var[it.ex]=famLevel(it.ex)-1;st.step=2;changes.push({t:"Back to "+e.name,d:"Two tough sessions in a row: next time the easier version, "+SETS+" × "+ladOf(e)[2]+" "+unitLabel(e)+"."})}}
      }else{
        st.hard=0;st.streak+=(feel==="easy"?2:1);
        if(st.streak>=2){
          st.streak=0;
          if(st.step<3){st.step++;changes.push({t:e.name+" gets harder",d:"Next time "+SETS+" × "+lad[st.step]+" "+unitLabel(e)+"."})}
          else if(isFam(it.ex)&&famLevel(it.ex)<FAM[it.ex].v.length-1){var was=e.name;S.var[it.ex]=famLevel(it.ex)+1;st.step=0;changes.push({t:"Level up: "+e.name,d:"You mastered "+was.toLowerCase()+". Next time "+SETS+" × "+ladOf(e)[0]+" "+unitLabel(e)+(e.start?", start light: "+e.start[0]+" kg":"")+"."})}
          else{st.load++;st.step=1;var w=kgOf(it.ex);if(w){S.weights[it.ex]=w+kgStep(it.slot);changes.push({t:e.name+": more weight",d:"Go to "+fmtKg(S.weights[it.ex])+" next time. Reps go back to "+lad[1]+"."})}else changes.push({t:e.name+": add weight",d:loadAdvice(e)+" Reps go back to "+lad[1]+"."})}
        }
      }
    });
  }
  var n=S.log.length;
  if(n%PER_MONTH===0){
    var m=monthOf(n);
    SLOTS.forEach(function(s){if(exFor(s.id,m)!==exFor(s.id,m-1)){var st=S.slots[s.id];if(st.step>0)st.step--;st.streak=0;st.hard=0}});
    changes.push({t:"Month "+(m-1)+" done",d:"Next session brings new exercises for month "+m+"."});
  }
  if(!changes.length)changes.push({t:"Same plan next time",d:"Do it once more like this and things start to go up."});
  sess.feel=feel;sess.before=before;sess.changes=changes;
}
function loadAdvice(e){var g=e.gear.toLowerCase();if(g.indexOf("dumbbell")>=0)return "Use heavier dumbbells, and log the new weight.";if(g.indexOf("backpack")>=0)return "Put 2 more books in the backpack.";if(g.indexOf("bag")>=0)return "Fill the bags a bit more.";if(g.indexOf("book")>=0)return "Use a heavier book.";return "Go slower: 3 seconds down on every rep."}
function refeel(feel){
  var sess=S.log[S.log.length-1];if(!sess||!sess.before)return;
  if(sess.before.slots){S.slots=JSON.parse(JSON.stringify(sess.before.slots));S.weights=JSON.parse(JSON.stringify(sess.before.weights||{}));S.var=JSON.parse(JSON.stringify(sess.before.var||S.var||{}))}else S.slots=JSON.parse(JSON.stringify(sess.before));
  applyProgression(sess,feel);save();
}

function viewToday(){

  if(re&&st.kind!=="doneToday")h+=strip(I.back,'<b>Welcome back.</b> Everything is one step easier today.','warn');
  else if(st.kind==="catchup")h+=strip(I.cal,'<b>'+DOWL[dow(st.from)]+' skipped, no drama.</b> It moved to today.');
  else if(st.kind==="first")h+=strip(I.cal,'<b>Your first session.</b> After this: every Tuesday and Friday.');
  var label="This session";
  if(st.kind==="doneToday"){
    var last=S.log[S.log.length-1];
    h+='<section class="hero" aria-label="Done today"><div class="row"><span class="tag">Done today</span><span class="meta">'+Math.round(last.secs/60)+' min</span></div><div class="big">Nice. That counts.</div><div class="btns"><span class="meta" style="align-self:center">Next: '+short(nextTrain(t))+(n===1?' · new exercises':'')+'</span><button class="btn btn-ghost" data-act="start" data-v="extra">Train again</button></div></section>';
    label="Next session";
  }else if(st.kind==="rest"){
    h+='<section class="hero" aria-label="Rest day"><div class="row"><span class="tag">Rest day</span><span class="meta">Session '+n+' of '+PER_MONTH+'</span></div><div class="big">Next: '+short(st.next)+'</div><div class="btns"><span class="meta" style="align-self:center">Nothing to do today.</span><button class="btn btn-ghost" data-act="start" data-v="full">Do it today</button></div></section>';
    label="Next session";
  }else{
    h+='<section class="hero" aria-label="Today\'s session"><div class="row"><span class="tag">Session '+n+' of '+PER_MONTH+'</span><span class="meta one">'+esc(gearLine(list))+'</span></div><div class="big">'+estMinutes(list,SETS)+' min</div>'+

/* ---------- Plan: shared projection ---------- */
function planDays(from,to){
  var t=today(),st=todayStatus(),proj=count(),out=[];
  timeline(from,t).forEach(function(x){
    if(x.state==="done")x.sessions.forEach(function(s){out.push({date:x.date,kind:"done",n:(s.n-1)%PER_MONTH+1,month:s.month,mins:Math.round(s.secs/60)})});
    else if(x.state==="missed")out.push({date:x.date,kind:"missed"});
    else if(x.state==="open"&&x.date<t)out.push({date:x.date,kind:"moved"});
  });
  if(st.kind==="catchup"||st.kind==="first"||st.kind==="due"){out.push({date:t,kind:"today",n:inMonth(),month:curMonth(),mins:estMinutes(lineupFor(curMonth()),SETS)});proj++}
  var d=nextTrain(t);
  while(d<=to){var sm=monthOf(proj),si=proj%PER_MONTH+1;out.push({date:d,kind:"planned",n:si,month:sm,isNew:si===1&&proj>0,mins:estMinutes(lineupFor(sm),SETS)});proj++;d=nextTrain(d)}
  return out;
}
function nextUp(){var a=planDays(today(),add(today(),14)).filter(function(x){return x.kind==="today"||x.kind==="planned"});return a[0]}

/* ---------- Player ---------- */
var P=null,tick=null,wake=null,actx=null;
function startSession(mode){
  var re=away()&&mode!=="extra";
  var list=lineup(re),sets=mode==="short"?1:SETS;
  P={mode:mode,reentry:re,sets:sets,items:list.map(function(it){return {slot:it.slot,ex:it.ex,target:it.dose.target,unit:it.dose.unit,kg:[],curKg:(re&&weighted(it.ex))?Math.max(0.5,kgOf(it.ex)-kgStep(it.slot)):kgOf(it.ex),done:0,easier:false}}),
     phase:"warm",wi:0,i:0,set:1,phaseStart:Date.now(),phaseLen:WARM[0].secs,paused:false,pausedAt:0,elapsed:0,lastTick:Date.now(),timer:false,confirm:false,dur:0};
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}

function beep(f,len){try{if(!actx)return;var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f||880;g.gain.value=.08;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+(len||.15))}catch(e){}}
function remaining(){return P.phaseLen-(Date.now()-P.phaseStart)/1000}
function onTick(){
  if(!P)return;var now=Date.now();

  P.elapsed+=(now-P.lastTick)/1000;P.lastTick=now;
  var el=document.getElementById("p-el");if(el)el.textContent=mmss(P.elapsed);
  if(P.phase==="warm"||P.phase==="rest"||(P.phase==="work"&&P.timer)){
    var r=remaining(),c=document.getElementById("p-count");if(c)c.textContent=mmss(r);
    if(r<=3.05&&r>2.8)beep(660,.08);
    if(r<=0){
      beep(990,.25);
      if(P.phase==="warm"){if(P.wi<WARM.length-1){P.wi++;P.phaseStart=now;P.phaseLen=WARM[P.wi].secs;renderPlayer()}else toWork()}
      else if(P.phase==="rest")toWork();
      else setDone();
    }
  }
}
function toWork(){P.phase="work";P.timer=false;renderPlayer()}
function setDone(){
  var it=P.items[P.i];it.kg[it.done]=it.curKg||0;it.done++;P.timer=false;
  var last=P.i===P.items.length-1&&P.set>=P.sets;
  if(last){finish(false);return}
  if(P.set<P.sets)P.set++;else{P.i++;P.set=1}
  P.phase="rest";P.phaseStart=Date.now();P.phaseLen=REST;renderPlayer();
}
function pause(on){
  if(on){P.paused=true;P.pausedAt=Date.now()}
  else{var d=Date.now()-P.pausedAt;P.phaseStart+=d;P.paused=false;P.lastTick=Date.now()}
  renderPlayer();
}

  clearInterval(tick);tick=null;try{wake&&wake.release()}catch(e){};wake=null;
  var ds=doneSets();
  if(early&&ds===0){P=null;layer.innerHTML="";render();toast("Nothing saved: no sets done yet");return}
  var n=S.log.length+1;
  var sess={id:"s"+Date.now(),date:today(),n:n,month:monthOf(n-1),secs:Math.round(P.elapsed),setsDone:ds,setsTotal:totalSets(),short:P.mode==="short",partial:early||ds<totalSets(),reentry:P.reentry,
    items:P.items.map(function(it){return {slot:it.slot,ex:it.ex,target:it.target,done:it.done,easier:it.easier,kg:it.kg.slice(0,it.done)}})};
  sess.items.forEach(function(it){var last=it.kg.length?it.kg[it.kg.length-1]:0;if(last>0)S.weights[it.ex]=last;else if(it.kg.length&&S.weights[it.ex])delete S.weights[it.ex]});

  }else{
    var mode=S.prefs.photo;
    var timerOn=P.phase==="work"&&P.timer;
    body='<div class="pphoto">'+photo(e.photo,"",mode,(e.note?'<span class="pnote">'+esc(e.note)+'</span>':'')+
        '<div class="pmode" role="group" aria-label="Photo">'+[["auto","Flip"],["start","Start"],["end","End"]].map(function(x){return '<button data-act="photo" data-v="'+x[0]+'" aria-pressed="'+(mode===x[0])+'">'+x[1]+'</button>'}).join("")+'</div>')+'</div>'+
      '<div class="pname"><div class="grow"><h2 class="one">'+esc(e.name)+'</h2><div class="g one">'+esc(e.gear)+'</div></div><div class="target"><div class="v">'+(timerOn?'<span id="p-count">'+mmss(remaining())+'</span>':it.target)+'</div><div class="u">'+unitLabel(e)+'</div></div></div>'+
      '<ol class="cues">'+e.cues.map(function(c,i){return '<li><span class="n">'+(i+1)+'</span><span>'+esc(c)+'</span></li>'}).join("")+'</ol>'+
      (e.start?kgRow(it):'');
    if(P.phase==="rest"){
      body+='<div class="pnext"><span class="one">Up next: '+esc(e.name)+', set '+P.set+'</span></div>'+
        '<div class="rest" role="timer"><div class="grow"><div class="l one">'+restKg(it)+'</div><div class="v" id="p-count">'+mmss(remaining())+'</div></div><div style="display:flex;gap:6px"><button class="plus" data-act="plus" aria-label="Add 15 seconds">+15</button><button data-act="skiprest">Skip</button></div></div>';
    }else{
      var nxt=P.set<P.sets?"Then rest, set "+(P.set+1):P.i<P.items.length-1?"Next: "+EX[P.items[P.i+1].ex].name:"Last set!";
      body+='<div class="pnext"><span class="one">'+esc(nxt)+'</span>'+(!it.easier?'<button class="linkbtn" data-act="easier">Too hard? 2 fewer</button>':'<span>Made easier</span>')+'</div>'+
        '<div class="ctrl"><button class="ibtn" data-act="pause" aria-label="Pause workout">'+I.pause+'</button>'+
        (e.unit==="sec"&&!P.timer?'<button class="btn btn-accent" data-act="starttimer">Start '+it.target+' s</button>':'<button class="btn btn-accent" data-act="setdone">'+(e.unit==="sec"?"Done early":"Set done")+'</button>')+'</div>';
    }
  }
  var ov="";
  if(P.paused&&!P.confirm)ov='<div class="overlay" role="dialog" aria-modal="true" aria-label="Paused"><h1 style="font-size:44px">Paused</h1><div style="color:#B9BDB4;max-width:280px">The timer is stopped. Take a call, chase the cat, come back whenever.</div><div class="w"><button class="btn btn-accent" data-act="resume">Resume</button><button class="btn btn-ghost" data-act="askend">End workout</button></div></div>';
  if(P.confirm)ov='<div class="sheet-wrap"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="end-h"><div class="hd"><h2 id="end-h">End the workout now?</h2></div><div class="muted">'+(ds?"You did "+ds+" of "+tot+" sets. That still counts as a session.":"You haven't finished a set yet, so nothing will be saved.")+'</div><div class="sbtns one1"><button class="btn btn-ink" data-act="endnow">'+(ds?"End and save":"End without saving")+'</button><button class="btn btn-line" data-act="cancelend">Keep going</button></div></div></div>';
  var focusKg=document.activeElement&&document.activeElement.id==="kg-input";
  layer.innerHTML='<div class="player" role="region" aria-label="Workout"><div class="in">'+head+body+'</div></div>'+ov;
  if(focusKg){var k=document.getElementById("kg-input");if(k)k.focus()}
}
function renderDone(){
  var s=P.sess,feel=s.feel||"right",full=!s.partial&&!s.short,ch=s.changes||[],maxCh=ch.length;
  layer.innerHTML='<div class="player done-screen" role="region" aria-label="Session done"><div class="in">'+
    '<div class="small" style="font-weight:700;flex:none">'+short(s.date)+' · '+(s.short?"Short version":"Month "+s.month+", session "+((s.n-1)%PER_MONTH+1))+'</div>'+
    '<h1 style="flex:none">'+(full?"Done.<br>You can sit now.":"Saved.<br>That counts.")+'</h1>'+
    '<div class="done-tiles"><div><div class="v">'+mmss(s.secs)+'</div><div class="k">time</div></div><div><div class="v">'+s.setsDone+'/'+s.setsTotal+'</div><div class="k">sets</div></div><div><div class="v">'+s.n+'</div><div class="k">sessions</div></div></div>'+
    '<div class="done-panel"><div style="flex:none"><h2 style="font-size:20px">How did that feel?</h2><div class="small" style="color:#4E534B">This decides how fast things get harder.</div></div>'+
    '<div class="feel">'+[["easy","Too easy"],["right","About right"],["hard","Too hard"]].map(function(x){return '<button data-act="feel" data-v="'+x[0]+'" aria-pressed="'+(feel===x[0])+'">'+x[1]+'</button>'}).join("")+'</div>'+
    '<div class="changes">'+ch.slice(0,maxCh).map(function(c){return '<div class="change"><b>'+esc(c.t)+'.</b> <span class="d">'+esc(c.d)+'</span></div>'}).join("")+
    (ch.length>maxCh?'<button class="more" data-act="more">+ '+(ch.length-maxCh)+' more change'+(ch.length-maxCh>1?"s":"")+'</button>':'')+'</div>'+
    '<div class="small" style="color:#4E534B;flex:none">Next: <b style="color:#15171A">'+nice(nextTrain(s.date))+'</b></div>'+
    '<button class="btn" style="background:#15171A;color:#fff;flex:none" data-act="closedone">Close</button></div></div></div>';
  fitChanges(ch.length);
}
/* Show as many changes as fit; the rest go behind a "+ N more" button. */
function fitChanges(total){
  var box=layer.querySelector(".changes");if(!box)return;
  var items=box.querySelectorAll(".change"),shown=items.length;
  function more(){var m=box.querySelector(".more");if(m)m.remove();if(shown<total)box.insertAdjacentHTML("beforeend",'<button class="more" data-act="more">+ '+(total-shown)+' more change'+(total-shown>1?"s":"")+'</button>')}
  more();
  while(shown>1&&box.scrollHeight>box.clientHeight+1){items[shown-1].remove();shown--;more()}
}

/* ---------- Backup ---------- */
function exportBackup(){
  var name="training-backup-"+today()+".json",json=JSON.stringify(S,null,1);
  var file;try{file=new File([json],name,{type:"application/json"})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Training backup"}).catch(function(){});return}
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
}
document.addEventListener("input",function(ev){
  if(ev.target.id!=="kg-input"||!P||!P.items)return;
  var raw=ev.target.value.replace(",",".").replace(/[^0-9.]/g,""),n=parseFloat(raw);
  P.items[P.i].curKg=isNaN(n)?0:Math.max(0,Math.min(300,n));
});
document.addEventListener("change",function(ev){
  if(ev.target.id!=="import-file"||!ev.target.files[0])return;
  var r=new FileReader();r.onload=function(){
    try{var d=JSON.parse(r.result);if(!d||d.v!==1||!Array.isArray(d.log)||!d.slots)throw 0;S=d;if(!S.weights)S.weights={};if(!S.var)S.var={};save();render();toast("Backup restored: "+S.log.length+" sessions")}
    catch(e){toast("That file isn't a training backup")}
  };r.readAsText(ev.target.files[0]);ev.target.value="";
});
/* ---------- Events ---------- */
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");if(!b)return;
  var a=b.getAttribute("data-act"),v=b.getAttribute("data-v"),x=b.getAttribute("data-x");
  if((a==="closesheet"||a==="closechanges")&&b.classList.contains("sheet-wrap")&&ev.target!==b)return;
  switch(a){
    case "tab":TAB=v;try{localStorage.setItem(KEY+"-tab",v)}catch(e){};render();break;
    case "start":startSession(v);break;
    case "ex":openExSheet(v,x,"today");break;
    case "exinfo":openExSheet(v,x,"exercises");break;
    case "exslot":EXSLOT=v;render();break;
    case "sheetswap":openSwap(v);break;
    case "swap":openSwap(v);break;
    case "pickswap":setSwap(v,x);break;
    case "useex":setSwap(v,x);break;
    case "closesheet":layer.innerHTML="";break;
    case "closechanges":var cw=b.closest(".sheet-wrap");if(cw)cw.remove();break;
    case "how":openHow();break;
    case "data":openData();break;
    case "reset":openReset();break;
    case "export":exportBackup();break;
    case "doreset":S=fresh();save();layer.innerHTML="";render();toast("Fresh start");break;
    case "pause":pause(true);break;
    case "resume":pause(false);break;
    case "askend":if(!P.paused)pause(true);P.confirm=true;renderPlayer();break;
    case "cancelend":P.confirm=false;pause(false);break;
    case "endnow":P.confirm=false;finish(true);break;
    case "skipwarm":toWork();break;
    case "warmnext":if(P.wi<WARM.length-1){P.wi++;P.phaseStart=Date.now();P.phaseLen=WARM[P.wi].secs;renderPlayer()}else toWork();break;
    case "setdone":setDone();break;
    case "starttimer":P.timer=true;P.phaseStart=Date.now();P.phaseLen=P.items[P.i].target;renderPlayer();break;
    case "skiprest":toWork();break;
    case "plus":P.phaseLen+=15;break;
    case "easier":var it=P.items[P.i];it.easier=true;it.target=Math.max(it.unit==="sec"?15:3,it.target-(it.unit==="sec"?10:2));renderPlayer();break;
    case "photo":S.prefs.photo=v;save();var pm=document.querySelector(".pphoto .flip");if(pm){pm.className="flip m-"+v;document.querySelectorAll(".pmode button").forEach(function(btn){btn.setAttribute("aria-pressed",String(btn.getAttribute("data-v")===v))})}break;
    case "famset":S.var[x]=Math.max(0,Math.min(FAM[x].v.length-1,famLevel(x)+parseInt(v,10)));save();render();openExSheet(b.getAttribute("data-s"),x,b.getAttribute("data-f"));toast(EX[x].name);break;
    case "kgset":setKg(P.items[P.i],parseFloat(v));break;
    case "kg":var ik=P.items[P.i];setKg(ik,(ik.curKg||0)+parseFloat(v));break;
    case "feel":refeel(v);P.sess=S.log[S.log.length-1];renderDone();break;
    case "more":openChanges();break;
    case "closedone":P=null;layer.innerHTML="";TAB="today";render();if(updateWaiting)location.reload();break;
  }
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"&&layer.querySelector(".sheet")&&!(P&&P.confirm)){layer.innerHTML=""}
  if(ev.key==="Enter"&&ev.target&&ev.target.id==="kg-input")ev.target.blur();
});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&P&&P.phase!=="done"&&navigator.wakeLock){navigator.wakeLock.request("screen").then(function(w){wake=w}).catch(function(){})}});

/* No zooming: block pinch and multi-finger gestures (double-tap zoom is off via touch-action). */
["gesturestart","gesturechange","gestureend"].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()},{passive:false})});
document.addEventListener("touchmove",function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener("wheel",function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});
/* Keep the layout fitted when the screen size changes. */
var rsz=null;window.addEventListener("resize",function(){clearTimeout(rsz);rsz=setTimeout(function(){if(!P&&!layer.innerHTML)render()},150)});

render();
var APP_VERSION = "2026.11.20-2";
var updateWaiting = false;
function checkForUpdate(){
  if(!navigator.onLine)return;
  fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(d){
    if(!d||!d.v||d.v===APP_VERSION)return;
    var tried=null;try{tried=localStorage.getItem(KEY+"-reloaded-for")}catch(e){}
    if(tried===d.v)return;
    try{localStorage.setItem(KEY+"-reloaded-for",d.v)}catch(e){}
    if(P&&P.phase!=="done"){updateWaiting=true;return}
    location.reload();
  }).catch(function(){});
}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")checkForUpdate()});
window.addEventListener("pageshow",function(ev){if(ev.persisted)checkForUpdate()});
setTimeout(checkForUpdate,1500);
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
</script>
</body>
</html>
